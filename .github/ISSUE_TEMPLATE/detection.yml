name: New detection
description: Propose a new Sentinel detection mapped to a MITRE ATT&CK technique.
title: "Detection: "
labels:
  - detection
body:
  - type: input
    id: technique-id
    attributes:
      label: ATT&CK technique ID
      placeholder: T1059.001
    validations:
      required: true
  - type: dropdown
    id: tactic
    attributes:
      label: Tactic
      options:
        - Initial Access
        - Execution
        - Persistence
        - Privilege Escalation
        - Defense Evasion
        - Credential Access
        - Discovery
        - Lateral Movement
        - Collection
        - Command and Control
        - Exfiltration
        - Impact
    validations:
      required: true
  - type: textarea
    id: what-to-detect
    attributes:
      label: What to detect
      description: The attacker behavior this rule should catch.
    validations:
      required: true
  - type: input
    id: data-source
    attributes:
      label: Data source
      placeholder: Sysmon EID 1 / SecurityEvent 4688
    validations:
      required: true
  - type: input
    id: atomic-test
    attributes:
      label: Atomic test ID
      placeholder: "T1059.001 #1"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
